<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CA3 Hipotez Laboratuvarı</title>
</head>
<body>
<meta charset="utf-8">
<div id="ca3-hypothesis-lab">
  <style>
    #ca3-hypothesis-lab { color: var(--foreground); width: 100%; }
    #ca3-hypothesis-lab .lab-controls { margin-block: 0.5rem 0.75rem; }
    #ca3-hypothesis-lab .lab-plot { width: 100%; min-height: 360px; }
    #ca3-hypothesis-lab .lab-plot svg { display: block; width: 100%; }
    #ca3-hypothesis-lab .lab-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.75rem; margin-block: 0.75rem; }
    #ca3-hypothesis-lab .lab-stat { min-width: 0; }
    #ca3-hypothesis-lab .lab-stat .viz-stat-value { overflow-wrap: anywhere; }
    #ca3-hypothesis-lab .lab-bottom { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.75fr); gap: 1rem; align-items: start; }
    #ca3-hypothesis-lab .lab-engrams { min-height: 180px; }
    #ca3-hypothesis-lab .lab-engrams svg { width: 100%; display: block; }
    #ca3-hypothesis-lab .lab-ablation { width: 100%; border-collapse: collapse; }
    #ca3-hypothesis-lab .lab-ablation th, #ca3-hypothesis-lab .lab-ablation td { padding: 0.35rem 0.45rem; border-bottom: 1px solid var(--border); text-align: end; }
    #ca3-hypothesis-lab .lab-ablation th:first-child, #ca3-hypothesis-lab .lab-ablation td:first-child { text-align: start; }
    #ca3-hypothesis-lab .lab-frame { fill: transparent; stroke: var(--border); stroke-width: 1; }
    #ca3-hypothesis-lab .lab-axis { fill: var(--foreground); font-size: 12px; }
    #ca3-hypothesis-lab .lab-muted { fill: var(--muted-foreground); color: var(--muted-foreground); }
    #ca3-hypothesis-lab .lab-cell { stroke: var(--background); stroke-width: 1; cursor: pointer; }
    #ca3-hypothesis-lab .lab-cell.is-selected { stroke: var(--foreground); stroke-width: 3; }
    #ca3-hypothesis-lab .lab-na { fill: var(--muted); }
    #ca3-hypothesis-lab .lab-tooltip { position: absolute; pointer-events: none; z-index: 10; padding: 0.4rem 0.55rem; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); border-radius: 0.35rem; display: none; }
    #ca3-hypothesis-lab .lab-dot-a { fill: var(--viz-series-1); }
    #ca3-hypothesis-lab .lab-dot-b { fill: var(--viz-series-2); }
    #ca3-hypothesis-lab .lab-dot-shared { fill: var(--viz-series-3); }
    #ca3-hypothesis-lab .lab-dot-off { opacity: 0.18; }
    #ca3-hypothesis-lab .lab-dot-on { stroke: var(--foreground); stroke-width: 2; }
    @media (max-width: 620px) {
      #ca3-hypothesis-lab .lab-grid { grid-template-columns: 1fr; }
      #ca3-hypothesis-lab .lab-bottom { grid-template-columns: 1fr; }
      #ca3-hypothesis-lab .lab-plot { min-height: 330px; }
    }
  </style>

  <h2>CA3 hipotez laboratuvarı</h2>
  <div class="viz-controls lab-controls">
    <label class="form-label" for="ca3-hypothesis">Hipotez
      <select class="form-select" id="ca3-hypothesis">
        <option value="H1">H1 — gereklilik</option>
        <option value="H2">H2 — yeterlilik</option>
        <option value="H3">H3 — konumsal rekabet</option>
      </select>
    </label>
    <label class="form-label" for="ca3-strength">Manipülasyon gücü
      <select class="form-select" id="ca3-strength"></select>
    </label>
    <label class="form-label" for="ca3-beta">Davranış eğimi β
      <select class="form-select" id="ca3-beta"></select>
    </label>
    <label class="form-label" for="ca3-overlap">Örtüşme <span id="ca3-overlap-value"></span>
      <input class="form-range" id="ca3-overlap" type="range" min="0" step="1">
    </label>
    <label class="form-label" for="ca3-access">Etkili erişim <span id="ca3-access-value"></span>
      <input class="form-range" id="ca3-access" type="range" min="0" step="1">
    </label>
  </div>

  <div class="lab-plot" id="ca3-phase-container">
    <svg id="ca3-phase-svg" role="img" aria-labelledby="ca3-phase-title ca3-phase-desc">
      <title id="ca3-phase-title">CA3 hipotez faz haritası</title>
      <desc id="ca3-phase-desc">Örtüşme ve etkili erişime göre model sonucu; hücre seçimi ayrıntıları günceller.</desc>
    </svg>
  </div>

  <div class="lab-grid">
    <div class="card viz-stat lab-stat"><div class="text-muted" id="ca3-metric-label"></div><div class="viz-stat-value" id="ca3-metric-value"></div><div class="text-small text-muted" id="ca3-metric-context"></div></div>
    <div class="card viz-stat lab-stat"><div class="text-muted" id="ca3-state-label"></div><div class="viz-stat-value" id="ca3-state-value"></div><div class="text-small text-muted" id="ca3-state-context"></div></div>
    <div class="card viz-stat lab-stat"><div class="text-muted">Model kararı</div><div class="viz-stat-value" id="ca3-decision"></div><div class="text-small text-muted" id="ca3-falsifier"></div></div>
  </div>

  <div class="lab-bottom">
    <section>
      <h3>Engram durumu</h3>
      <div class="lab-engrams"><svg id="ca3-engram-svg" role="img" aria-label="A, B ve ortak hücrelerin seçili koşuldaki şematik durumu"></svg></div>
    </section>
    <section>
      <h3>Mekanizma ablasyonları</h3>
      <div class="table-responsive"><table class="table table-sm lab-ablation"><thead><tr><th>Devre</th><th>10 kapı</th><th>H2 A</th><th>H3 kurulur</th></tr></thead><tbody id="ca3-ablation-body"></tbody></table></div>
    </section>
  </div>
  <div class="lab-tooltip text-small" id="ca3-tooltip" role="tooltip"></div>

        if (hypothesis === 'H1') {
          metricLabel.textContent = 'Nöral gereklilik'; metricValue.textContent = signed(cell.h1de);
          metricContext.textContent = `Δ reaktivasyon ${signed(cell.h1react)} · beklenen ΔDR(β=${beta}) ${signed(cell.h1dr[beta])}`;
          stateLabel.textContent = 'A çekicisi bozuldu'; stateValue.textContent = pct(cell.h1non);
          stateContext.textContent = `Şansa-yakın kanıt ${pct(cell.h1chance)}`;
          const minimal = cell.h1de < 0; const strong = cell.h1chance >= 0.8;
          decision.textContent = strong ? 'Güçlü H1 desteklenir' : minimal ? 'Kısmi H1; çöküş yok' : 'H1 desteklenmez';
          falsifier.textContent = 'Doğrulanmış erişimde beklenen nöral azalma yoksa minimal H1 reddedilir.';
        } else if (hypothesis === 'H2') {
          metricLabel.textContent = 'A yönlü kanıt değişimi'; metricValue.textContent = signed(cell.h2de);
          metricContext.textContent = `Beklenen ΔDR(β=${beta}) ${signed(cell.h2dr[beta])}`;
          stateLabel.textContent = 'A çekicisine geçiş'; stateValue.textContent = pct(cell.h2a);
          stateContext.textContent = `${DATA.nStructures} yapısal ağ`;
          decision.textContent = cell.h2a >= 0.8 ? 'H2 desteklenir' : cell.h2de > 0 ? 'A yönlü kayma; eşik altı' : 'H2 desteklenmez';
          falsifier.textContent = 'Etkili erişim ≥%22,5 iken A yönlü kayma yoksa bu yüzey reddedilir.';
        } else {
          metricLabel.textContent = 'Konum × susturma'; metricValue.textContent = cell.h3i == null ? 'NA' : signed(cell.h3i);
          metricContext.textContent = `ΔE önde ${signed(cell.h3lead)} · geride ${signed(cell.h3trail)} · ΔDR etkileşimi ${signed(cell.h3dr[beta])}`;
          stateLabel.textContent = 'Rakip B’ye tam geçiş'; stateValue.textContent = pct(cell.h3b);
          stateContext.textContent = `Başlangıç ayrışması ${pct(cell.h3q)}`;
          const positional = cell.h3q >= 0.8 && cell.h3i < 0 && cell.h3as >= 0.8;
          decision.textContent = cell.h3q < 0.8 ? 'H3 test edilemez' : cell.h3b >= 0.8 ? 'Güçlü H3 desteklenir' : positional ? 'Asimetri var; tam flip yok' : 'H3 desteklenmez';
          falsifier.textContent = '65/35–35/65 başlangıcı kurulmuşken etkileşim ≥0 ise H3 reddedilir.';
        }
      }

      function renderAblations() {
        const labels = { intact: 'Sağlam çekirdek', no_recurrence: 'Rekürrens yok', no_sparse_inhibition: 'Seyrek inhibisyon yok', zero_overlap: 'Örtüşme yok' };
        const body = root.querySelector('#ca3-ablation-body'); body.replaceChildren();
        DATA.ablations.forEach(row => {
          const tr = document.createElement('tr');
          [labels[row.name], pct(row.gates), pct(row.h2A), pct(row.h3Qualified)].forEach((value, index) => {
            const td = document.createElement(index === 0 ? 'th' : 'td'); td.textContent = value; tr.appendChild(td);
          });
          body.appendChild(tr);
        });
      }

      function update() {
        const o = DATA.overlaps[Number(controls.overlap.value)];
        const a = DATA.accesses[Number(controls.access.value)];
        const s = Number(controls.strength.value);
        selected = cellFor(o, a, s);
        root.querySelector('#ca3-overlap-value').textContent = pct(o);
        root.querySelector('#ca3-access-value').textContent = pct(a);
        drawHeatmap(); updateDetails(selected); drawEngrams(selected);
      }
      Object.values(controls).forEach(control => control.addEventListener('input', update));
      new ResizeObserver(update).observe(root.querySelector('#ca3-phase-container'));
      new ResizeObserver(() => selected && drawEngrams(selected)).observe(engramSvg.parentElement);
      renderAblations(); update();
    })();
  </script>
</div>

</body>
